<title>Rudra's Day</title>
<style>
:root{
  --bg:#F5F1E8; --card:#ffffff; --field:#fdfbf6; --soft:#EDE7D9; --tint:#EAF1EA;
  --line:#E2DACB; --ink:#37352D; --muted:#8C8576; --primary:#3F6B52; --clay:#C2774F;
  --danger:#C57A7A; --tip:#F4EDE2; --tipgood:#E9F0E7; --shadow:rgba(63,107,82,0.09);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1B1A17; --card:#262420; --field:#2E2B24; --soft:#302C25; --tint:#232A24;
    --line:#3A362E; --ink:#ECE6D9; --muted:#A69E8E; --primary:#5C9273; --clay:#D08A61;
    --danger:#D68C8C; --tip:#2E2A22; --tipgood:#233026; --shadow:rgba(0,0,0,0.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
body{padding-bottom:env(safe-area-inset-bottom);}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:100px;}
.head{padding:calc(22px + env(safe-area-inset-top)) 20px 20px;background:var(--tint);border-radius:0 0 28px 28px;margin-bottom:14px;}
.headrow{display:flex;align-items:center;gap:13px;}
.avatar{width:50px;height:50px;border-radius:50%;object-fit:cover;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--primary);font-size:20px;flex-shrink:0;border:2px solid var(--card);box-shadow:0 2px 8px var(--shadow);}
.avatar-lg{width:76px;height:76px;border-radius:50%;object-fit:cover;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--primary);font-size:28px;border:1px solid var(--line);}
.title{font-size:25px;font-weight:800;letter-spacing:-0.4px;margin:0;}
.sub{font-size:13px;color:var(--muted);margin:3px 0 0;}
.card{background:var(--card);border-radius:22px;padding:17px;margin:0 16px 16px;box-shadow:0 3px 16px var(--shadow);}
.row{display:flex;align-items:center;gap:10px;}
.between{justify-content:space-between;}
.daynav{display:flex;align-items:center;justify-content:space-between;padding:0 18px 12px;}
.daylabel{font-size:15px;font-weight:800;}
.arrow{background:var(--card);border:none;width:40px;height:40px;border-radius:14px;font-size:18px;cursor:pointer;box-shadow:0 2px 10px var(--shadow);color:var(--primary);}
.arrow:disabled{opacity:0.3;}
.pillrow{display:flex;gap:8px;flex-wrap:wrap;}
.typebtn{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:10px 13px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink);}
.typebtn.active{color:#fff;border-color:transparent;background:var(--primary);}
input.fld,select.fld{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;font-size:16px;font-family:inherit;color:var(--ink);background:var(--field);}
input.fld:focus,select.fld:focus{outline:none;border-color:var(--primary);}
.label{font-size:12px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px;}
.preset{border:none;background:var(--soft);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);}
.add{width:100%;border:none;background:var(--primary);color:#fff;border-radius:16px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;margin-top:12px;box-shadow:0 3px 10px var(--shadow);}
.quick{display:flex;gap:9px;}
.quick button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:13px 8px;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink);}
.quick button.set{background:var(--tint);border-color:transparent;}
.tlitem{display:flex;gap:12px;padding:11px 0;}
.tldot{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;background:var(--soft);}
.tlbody{flex:1;min-width:0;}
.tltime{font-size:12px;font-weight:700;color:var(--muted);}
.tlitems{font-size:15px;font-weight:700;margin:1px 0 0;overflow-wrap:anywhere;}
.tlitems .tag{color:var(--muted);font-weight:700;}
.tlnote{font-size:13px;color:var(--muted);margin:2px 0 0;}
.del{background:none;border:none;color:var(--muted);opacity:.6;cursor:pointer;font-size:16px;padding:4px;}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:26px 14px;line-height:1.55;}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;max-width:520px;margin:0 auto;box-shadow:0 -3px 18px var(--shadow);padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;border:none;background:none;padding:9px 4px 12px;cursor:pointer;font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;}
.tab .ic{font-size:19px;padding:3px 14px;border-radius:13px;transition:background .15s;}
.tab.active{color:var(--primary);}
.tab.active .ic{background:var(--tint);}
.stat{display:flex;gap:10px;flex-wrap:wrap;}
.chip{background:var(--soft);border-radius:14px;padding:8px 13px;font-size:13px;font-weight:700;}
.grouprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.group{border-radius:20px;padding:7px 13px;font-size:13px;font-weight:700;}
.group.on{background:var(--primary);color:#fff;}
.group.off{background:var(--soft);color:var(--muted);}
.tip{background:var(--tip);border-left:3px solid var(--clay);border-radius:0 14px 14px 0;padding:12px 14px;font-size:14px;margin-top:10px;line-height:1.45;}
.tip.good{background:var(--tipgood);border-left-color:var(--primary);}
.ghost{width:100%;border:1.5px solid var(--primary);background:var(--card);color:var(--primary);border-radius:16px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;}
.mini{font-size:12px;color:var(--muted);line-height:1.55;}
.toggle{display:flex;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;}
.toggle button{border:none;background:var(--card);padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);}
.toggle button.on{background:var(--primary);color:#fff;}
table.gr{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px;}
table.gr th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:6px 4px;}
table.gr td{padding:9px 4px;border-top:1px solid var(--soft);}
.chart{width:100%;height:130px;}
.thumb{width:64px;height:64px;border-radius:14px;object-fit:cover;border:1px solid var(--line);display:block;}
.thumbx{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;line-height:20px;text-align:center;cursor:pointer;padding:0;}
.tlphoto{width:130px;max-width:62%;border-radius:14px;margin-top:6px;display:block;border:1px solid var(--line);cursor:pointer;}
.addbtn{border-style:dashed;color:var(--muted);font-weight:700;}
.link{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;padding:0;}
.banner{display:flex;align-items:center;gap:10px;margin:0 16px 14px;background:var(--tip);border:1px solid var(--line);border-left:3px solid var(--clay);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--ink);}
.bannerbtn{border:none;background:var(--primary);color:#fff;border-radius:12px;padding:9px 12px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap;}
.bannerx{border:none;background:none;color:var(--muted);font-size:15px;cursor:pointer;padding:2px 4px;}
#printarea{display:none;}
@media print{body{background:#fff;}body *{visibility:hidden;}#printarea,#printarea *{visibility:visible;}#printarea{display:block;position:absolute;left:0;top:0;width:100%;padding:24px;color:#000;}.tabs,.banner{display:none !important;}}
</style>
</head>

  function chartSvg(points, field, label, color) {
